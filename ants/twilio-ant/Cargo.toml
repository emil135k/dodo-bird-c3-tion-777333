[package]
name = "twilio-ant"
version = "0.1.0"
edition = "2021"
description = "Twilio Ant — WebSocket bridge between Twilio voice calls and the iceoryx2 swarm."
authors = ["Emil & Cody — Sparked Matter LLC"]

[dependencies]
# iceoryx2 zero-copy bus
iceoryx2 = "0.6"
iceoryx2-bb-system-types = "0.6"
iceoryx2-bb-container = "0.6"

# Async runtime + WebSocket server
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
futures-util = "0.3"

# Twilio REST API for outbound calls
reqwest = { version = "0.12", features = ["json"] }

# Serialization + codec
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

# Mu-law codec (ITU-T G.711)
audio-codec-algorithms = "0.5"

# Config
chrono = "0.4"
