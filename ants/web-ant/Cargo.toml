[package]
name = "web-ant"
version = "0.2.0"
edition = "2021"
description = "Web Ant — WebSocket/HTTP gateway. Twilio Media Streams ↔ iceoryx2 bus. Zero audio processing."
authors = ["Emil & Cody — Sparked Matter LLC"]

[dependencies]
# iceoryx2 zero-copy bus
iceoryx2 = "0.8"

# Async runtime + WebSocket server
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
futures-util = "0.3"

# REST API client (Twilio outbound calls)
reqwest = { version = "0.12", features = ["json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
