[package]
name = "llm-ant"
version = "0.2.0"
edition = "2021"
description = "LLM Ant — Brain. Subscribes to stt_text, thinks, publishes to tts_text. Configurable provider."
authors = ["Emil & Cody — Sparked Matter LLC"]

[dependencies]
iceoryx2 = "0.8"
iceoryx2-bb-system-types = "0.8"
iceoryx2-bb-container = "0.8"
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
