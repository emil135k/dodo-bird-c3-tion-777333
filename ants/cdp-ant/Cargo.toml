[package]
name = "cdp-ant"
version = "0.1.0"
edition = "2021"
description = "CDP Ant — Bridges iceoryx2 bus to browser AIs via Chrome DevTools Protocol"
authors = ["Emil & Cody — Sparked Matter LLC"]

[dependencies]
iceoryx2 = "0.8"
iceoryx2-bb-system-types = "0.8"
iceoryx2-bb-container = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.26"
serde_json = "1"
futures-util = "0.3"
reqwest = { version = "0.12", features = ["json"] }
