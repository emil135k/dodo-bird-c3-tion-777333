[package]
name = "phone-silero-ant"
version = "0.2.0"
edition = "2021"
description = "Phone Silero Ant — VAD for phone audio (16kHz). No resampling. Clean path."
authors = ["Emil & Cody — Sparked Matter LLC"]

[dependencies]
iceoryx2 = "0.8"
iceoryx2-bb-system-types = "0.8"
iceoryx2-bb-container = "0.8"

# Silero VAD v6 — native 16kHz for phone audio
silero-vad-rust = { version = "6.2", default-features = false }

# Config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
