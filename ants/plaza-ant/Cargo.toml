[package]
name = "plaza-ant"
version = "0.3.0"
edition = "2021"
description = "Plaza Ant — Village Square dispatcher. Receives filmstrip notifications, dispatches review prompts to CLI agents via tmux and web agents via chromiumoxide CDP."
authors = ["Emil & Cody — Sparked Matter LLC"]

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
chromiumoxide = { version = "0.9", default-features = false, features = ["bytes"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
