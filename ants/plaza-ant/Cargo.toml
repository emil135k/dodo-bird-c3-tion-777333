[package]
name = "plaza-ant"
version = "1.0.0"
edition = "2021"
description = "Plaza Ant — Village Square dispatcher. Chromiumoxide for prompt injection, raw tokio-tungstenite for scraping."
authors = ["Emil & Cody — Sparked Matter LLC"]

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
chromiumoxide = { version = "0.9", default-features = false, features = ["bytes"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
