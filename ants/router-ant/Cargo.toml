[package]
name = "router-ant"
version = "0.1.0"
edition = "2021"
description = "Router Ant — Routes stt_text to console or LLM based on mode"
authors = ["Emil & Cody — Sparked Matter LLC"]

[dependencies]
iceoryx2 = "0.8"
iceoryx2-bb-system-types = "0.8"
iceoryx2-bb-container = "0.8"
tokio = { version = "1", features = ["full"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
