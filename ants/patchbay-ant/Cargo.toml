[package]
name = "patchbay-ant"
version = "0.2.0"
edition = "2021"
description = "Patchbay Ant — Audio device routing. Replaces ear + mouth. Config-driven."
authors = ["Emil, Cody & Lyra — Sparked Matter LLC"]

[dependencies]
iceoryx2 = "0.8"

# Audio device access
cpal = "0.15"

# Playback
rodio = "0.20"

# Config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
